<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mandarin Lantern Quiz 🏮</title>
<style>
:root{--bg:#fff1dc;--card:#fff;--ink:#3b0a0a;--red:#c8102e;--gold:#e0a100;--ok:#1a8f4c;--bad:#c8102e;--mut:#8a6a5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#240609;--card:#3a0d12;--ink:#ffeccc;--gold:#ffc83d;--mut:#c9a68f;--red:#ff4d5e;--ok:#4fd18b}}
:root[data-theme="dark"]{--bg:#240609;--card:#3a0d12;--ink:#ffeccc;--gold:#ffc83d;--mut:#c9a68f;--red:#ff4d5e;--ok:#4fd18b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;background-image:radial-gradient(circle at 50% -10%,rgba(224,161,0,.25),transparent 60%)}
.w{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:2px solid var(--gold);border-radius:18px;padding:18px;box-shadow:0 6px 0 rgba(200,16,46,.35)}
h1{margin:0 0 6px;font-size:28px;color:var(--red)}
.hz{font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif}
.big{font-size:28px;font-weight:700;margin:10px 0 14px;text-align:center}
.lab{color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
button{font:inherit;cursor:pointer}
.go{width:100%;padding:14px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:700;font-size:17px;margin-top:10px}
.opt{display:block;width:100%;text-align:left;padding:13px;margin:8px 0;border:2px solid var(--gold);border-radius:12px;background:transparent;color:var(--ink);font-size:18px}
.opt.dis{opacity:.25;pointer-events:none}.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}
input{width:100%;padding:13px;margin:6px 0;border:2px solid var(--gold);border-radius:12px;background:transparent;color:var(--ink);font-size:18px}
.top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px;font-size:15px}
.bar{height:10px;border-radius:9px;background:rgba(224,161,0,.25);overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));width:100%}
.cards{display:flex;gap:8px;margin-top:14px;min-height:64px}
.pc{flex:1;border:2px dashed var(--gold);border-radius:12px;padding:6px;text-align:center;background:transparent;color:var(--ink);font-size:12px}
.pc b{display:block;font-size:22px}
.fb{margin-top:10px;padding:10px;border-radius:12px;background:rgba(224,161,0,.15);font-size:15px}
.rules{padding-left:18px;line-height:1.6;font-size:15px}
.stat{font-size:44px;font-weight:800;color:var(--red);text-align:center}
.sec{display:flex;gap:8px}.sec button{flex:1}.alt{background:var(--gold);color:#3b0a0a}
.play{font-size:42px;width:100%;padding:14px;border:2px solid var(--gold);border-radius:14px;background:transparent}
</style></head><body><div class="w" id="app"></div>
<script>
const parse=t=>t.trim().split('\n').map(l=>{const [h,p,m]=l.split('|');return{h,p,m}});
const V=parse(`零|líng|nol (0)
一|yī|satu (1)
二|èr|dua (2)
三|sān|tiga (3)
四|sì|empat (4)
五|wǔ|lima (5)
六|liù|enam (6)
七|qī|tujuh (7)
八|bā|delapan (8)
九|jiǔ|sembilan (9)
十|shí|sepuluh (10)
一百|yì bǎi|seratus (100)
一千|yì qiān|seribu (1000)
新|xīn|baru
同學|tóngxué|teman sekelas
她|tā|dia (perempuan)
誰|shéi|siapa
叫|jiào|dipanggil / bernama
姓|xìng|bermarga
很|hěn|sangat
可愛|kě'ài|lucu / imut
哪|nǎ|yang mana
國|guó|negara
妳|nǐ|kamu (perempuan)
知道|zhīdào|tahu
嗎|ma|partikel tanya (apakah)
日本|Rìběn|Jepang
臺灣|Táiwān|Taiwan
中國|Zhōngguó|Tiongkok
美國|Měiguó|Amerika
英國|Yīngguó|Inggris
印尼|Yìnní|Indonesia
漂亮|piàoliang|cantik
幾|jǐ|berapa
點|diǎn|jam / pukul
現在|xiànzài|sekarang
去|qù|pergi
學校|xuéxiào|sekolah
媽媽|māma|ibu
爸爸|bàba|ayah
孩子|háizi|anak
今天|jīntiān|hari ini
星期|xīngqī|minggu / hari dalam seminggu
月|yuè|bulan
號|hào|tanggal (lisan)
日|rì|hari / tanggal (tulisan)
星期天|xīngqītiān|hari Minggu
早上|zǎoshang|pagi
有|yǒu|ada / punya
沒有|méiyǒu|tidak ada
課|kè|pelajaran / kelas
中午|zhōngwǔ|tengah hari
回家|huí jiā|pulang ke rumah
下午|xiàwǔ|sore / siang
下課|xiàkè|pulang / kelas selesai
四十|sìshí|empat puluh (40)
明天|míngtiān|besok
週末|zhōumò|akhir pekan
要|yào|mau
不要|búyào|tidak mau
生日|shēngrì|ulang tahun
快樂|kuàilè|bahagia / selamat
晚上|wǎnshang|malam
來|lái|datang
家|jiā|rumah
好|hǎo|baik / bagus
沒問題|méi wèntí|tidak masalah
明天見|míngtiān jiàn|sampai jumpa besok
學生|xuéshēng|pelajar
歲|suì|tahun (usia)
起床|qǐchuáng|bangun tidur
上課|shàngkè|masuk kelas
吃午飯|chī wǔfàn|makan siang
圖書館|túshūguǎn|perpustakaan
做飯|zuò fàn|memasak
吃飯|chī fàn|makan
睡覺|shuìjiào|tidur
忙|máng|sibuk
六點|liù diǎn|jam enam
七點|qī diǎn|jam tujuh
八點|bā diǎn|jam delapan
九點|jiǔ diǎn|jam sembilan
十點|shí diǎn|jam sepuluh
十一點|shíyī diǎn|jam sebelas
十二點|shíèr diǎn|jam dua belas
一點|yī diǎn|jam satu
四點|sì diǎn|jam empat
五點|wǔ diǎn|jam lima
六點半|liù diǎn bàn|jam setengah tujuh (6.30)
八點四十分|bā diǎn sìshí fēn|jam 8.40
為什麼|wèishénme|mengapa
怎麼呀|zěnme ya|kenapa / bagaimana (ya)
可是|kěshì|tetapi (lisan)
還是|háishi|atau (dalam pertanyaan)
如果|rúguǒ|jika / kalau
但是|dànshì|tetapi (formal)`);
const S=parse(`她是新同學。|Tā shì xīn tóngxué.|Dia adalah teman sekelas baru.
妳是哪國人？|Nǐ shì nǎ guó rén?|Kamu orang negara mana?
我是印尼人。|Wǒ shì Yìnní rén.|Saya orang Indonesia.
她很可愛。|Tā hěn kě'ài.|Dia sangat lucu.
現在幾點？|Xiànzài jǐ diǎn?|Sekarang jam berapa?
今天星期天。|Jīntiān xīngqītiān.|Hari ini hari Minggu.
明天是我的生日。|Míngtiān shì wǒ de shēngrì.|Besok ulang tahunku.
生日快樂！|Shēngrì kuàilè!|Selamat ulang tahun!
我早上六點起床。|Wǒ zǎoshang liù diǎn qǐchuáng.|Saya bangun jam 6 pagi.
下午我去圖書館。|Xiàwǔ wǒ qù túshūguǎn.|Sore ini saya ke perpustakaan.
我們八點四十分上課。|Wǒmen bā diǎn sìshí fēn shàngkè.|Kami masuk kelas jam 8.40.
晚上我回家吃飯。|Wǎnshang wǒ huí jiā chī fàn.|Malam saya pulang makan.
明天見！|Míngtiān jiàn!|Sampai jumpa besok!
妳知道嗎？|Nǐ zhīdào ma?|Apakah kamu tahu?
如果沒有課，我要睡覺。|Rúguǒ méiyǒu kè, wǒ yào shuìjiào.|Kalau tidak ada kelas, saya mau tidur.
我很忙，但是沒問題。|Wǒ hěn máng, dànshì méi wèntí.|Saya sibuk, tapi tidak masalah.`);
const CARDS={time:['⏱️','+30 Detik'],fifty:['🎯','50:50 / Hint'],shield:['🛡️','Pelindung Streak'],dbl:['✨','Skor x2'],skip:['⏭️','Lewati']};
const $=s=>document.querySelector(s),app=$('#app');
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const np=s=>s.normalize('NFD').replace(/[\u0300-\u036f0-9\s'’\-]/g,'').toLowerCase();
const nh=s=>s.replace(/[\s，。！？,.!?]/g,'').replace(/妳/g,'你');
const LB={hm:['Apa arti kata ini?','h','m'],mh:['Pilih hanzi yang tepat:','m','h'],ph:['Pilih hanzi dari pinyin:','p','h'],hp:['Pilih pinyin yang tepat:','h','p']};
let Q,i,score,streak,best,ok,cards,shield,dbl,left,locked,q,tm;
function build(){const v=sh(V),Z=[];
 v.slice(0,20).forEach(x=>Z.push({t:'w',x}));
 v.slice(20,40).forEach(x=>{const k=sh(Object.keys(LB))[0],[lab,f,g]=LB[k];
  const o=sh(V.filter(y=>y!==x&&y[g]!==x[g])).slice(0,3).map(y=>y[g]);
  Z.push({t:'m',x,lab,q:x[f],qf:f,a:x[g],o:sh([x[g],...o])})});
 sh(S).slice(0,10).forEach(x=>{const o=sh(S.filter(y=>y!==x)).slice(0,3).map(y=>y.h);Z.push({t:'l',x,a:x.h,o:sh([x.h,...o])})});
 return sh(Z)}
function home(){app.innerHTML=`<div class="card"><h1>🏮 Mandarin Lantern Quiz</h1><div class="lab">50 soal · kata & kalimat Mandarin</div>
<ul class="rules"><li>✍️ 20 soal tulis hanzi + pinyin</li><li>🔘 20 soal pilihan ganda</li><li>🎧 10 soal listening (dengarkan, pilih kalimat)</li><li>⏱️ 60 detik per soal. Makin cepat, makin tinggi poin. Waktu habis = 0 poin & streak putus.</li><li>🔥 Streak benar beruntun menaikkan pengali skor (maks x2)</li><li>🃏 Dapat Power Card acak tiap 5 soal (simpan maks 3)</li><li>🔀 Urutan soal & kartu diacak tiap kali main</li></ul>
<button class="go" onclick="start()">Mulai Quiz 🚀</button></div>`}
function start(){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}Q=build();i=0;score=0;streak=0;best=0;ok=0;shield=false;dbl=false;cards=[sh(Object.keys(CARDS))[0]];show()}
function show(){q=Q[i];locked=false;left=60;clearInterval(tm);
 let b='';
 if(q.t==='w')b=`<div class="lab">✍️ Tulis hanzi (tradisional) & pinyin</div><div class="big">${q.x.m}</div><input id="ih" class="hz" placeholder="漢字" autocomplete="off"><input id="ip" placeholder="pinyin (nada boleh dilewati)" autocomplete="off" autocapitalize="off"><div id="hint"></div><button class="go" onclick="subW()">Kirim</button>`;
 else if(q.t==='m')b=`<div class="lab">🔘 ${q.lab}</div><div class="big ${q.qf==='h'?'hz':''}">${q.q}</div>${opts()}`;
 else b=`<div class="lab">🎧 Dengarkan, lalu pilih kalimat yang benar</div><button class="play" onclick="say()">🔊 Putar ulang</button><div id="vs" class="lab" style="margin:8px 0"></div><button class="opt" style="font-size:14px;text-align:center" onclick="showPy()">👁️ Tampilkan pinyin (jika suara tidak keluar)</button>${opts()}`;
 app.innerHTML=`<div class="top"><span>#${i+1}/50</span><span>🔥 ${streak}${shield?' 🛡️':''}${dbl?' ✨':''}</span><span>⭐ ${score}</span><span id="tl">60</span></div><div class="bar"><i id="bi"></i></div><div class="card" id="qc">${b}<div id="fb"></div></div><div class="cards" id="cs"></div>`;
 drawCards();tm=setInterval(tick,100);
 if(q.t==='l')say();else if(q.t==='w')$('#ih').focus();
 if(q.t==='w')app.querySelectorAll('input').forEach(e=>e.onkeydown=ev=>{if(ev.key==='Enter')subW()})}
const opts=()=>q.o.map((o,k)=>`<button class="opt ${q.t==='l'||q.a===q.x.h||q.o.every(z=>/[\u4e00-\u9fff]/.test(z))?'hz':''}" onclick="pick(${k})">${o}</button>`).join('');
let VZ=[];function loadV(){try{VZ=speechSynthesis.getVoices()||[]}catch(e){}}
try{loadV();speechSynthesis.onvoiceschanged=loadV}catch(e){}
function zhVoice(){loadV();return VZ.find(v=>/^zh[-_]?TW|cmn[-_]Hant/i.test(v.lang))||VZ.find(v=>/^zh|cmn/i.test(v.lang))}
function say(){const st=$('#vs');
 try{const ss=window.speechSynthesis;
  if(!ss||!window.SpeechSynthesisUtterance){if(st)st.innerHTML='⚠️ Browser tidak mendukung suara. Coba buka link di Chrome/Safari langsung.';return}
  if(ss.speaking||ss.pending)ss.cancel();
  ss.resume();
  const u=new SpeechSynthesisUtterance(q.x.h.replace(/[！？。，]/g,' '));const v=zhVoice();
  u.lang=v?v.lang:'zh-TW';if(v)u.voice=v;u.rate=.8;u.volume=1;
  u.onerror=e=>{if(st&&e.error!=='canceled'&&e.error!=='interrupted')st.textContent='⚠️ Suara gagal ('+e.error+'). Pakai tombol Tampilkan pinyin.'};
  ss.speak(u);
  if(st)st.innerHTML=v?'🔊 Suara: '+v.name:'⚠️ Suara Mandarin belum terdeteksi. Di Android: Pengaturan > Bahasa > Text-to-speech > Google, unduh data bahasa Mandarin. Sementara, pakai Tampilkan pinyin.'
 }catch(e){if(st)st.textContent='⚠️ Suara tidak bisa diputar.'}}
function showPy(){$('#vs').innerHTML=`<span class="hz">${q.x.h}</span><br>${q.x.p}`}
function tick(){if(locked)return;left-=.1;$('#tl').textContent=Math.max(0,Math.ceil(left))+'s';$('#bi').style.width=Math.min(100,left/60*100)+'%';if(left<=0)end(0,true)}
function drawCards(){$('#cs').innerHTML=cards.length?cards.map((c,k)=>`<button class="pc" onclick="useCard(${k})"><b>${CARDS[c][0]}</b>${CARDS[c][1]}</button>`).join(''):'<div class="lab" style="margin:auto">Belum ada Power Card — dapat tiap 5 soal 🃏</div>'}
function useCard(k){if(locked)return;const c=cards[k];
 if(c==='time')left+=30;
 else if(c==='fifty'){if(q.t==='w'){$('#hint').innerHTML=`<div class="fb">💡 Hanzi diawali ${q.x.h[0]} · pinyin diawali "${q.x.p[0]}"</div>`}
  else{const w=[...app.querySelectorAll('.opt')].filter((_,j)=>q.o[j]!==q.a);sh(w).slice(0,2).forEach(e=>e.classList.add('dis'))}}
 else if(c==='shield')shield=true;else if(c==='dbl')dbl=true;
 else if(c==='skip'){cards.splice(k,1);return end(-1)}
 cards.splice(k,1);drawCards();document.querySelector('.top span:nth-child(2)').textContent=`🔥 ${streak}${shield?' 🛡️':''}${dbl?' ✨':''}`}
function pick(k){if(locked)return;const good=q.o[k]===q.a;
 app.querySelectorAll('.opt').forEach((e,j)=>{if(q.o[j]===q.a)e.classList.add('ok');else if(j===k)e.classList.add('no')});end(good?1:0)}
function subW(){if(locked)return;const a=nh($('#ih').value)===nh(q.x.h),b=np($('#ip').value)===np(q.x.p);end((a+b)/2)}
function end(f,timeout){if(locked)return;locked=true;clearInterval(tm);let pts=0,msg='',good=f===1;
 if(f===-1){msg='⏭️ Soal dilewati (0 poin, streak aman).';}
 else if(timeout){msg='⌛ Waktu habis! Poin 0.';good=false}
 else if(f>0){const m=good?1+Math.min(streak+1,10)*.1:1;pts=Math.round((100*f+50*f*Math.max(left,0)/60)*m*(dbl?2:1));msg=good?`✅ Benar! +${pts}`:`🟡 Setengah benar +${pts}`}
 else msg='❌ Salah.';
 if(f>=0){if(good){streak++;ok++;best=Math.max(best,streak)}else if(shield&&f<1){shield=false;msg+=' 🛡️ Streak diselamatkan!'}else streak=0;if(f!==-1||true)dbl=false}
 score+=pts;
 const n=i+1;let got='';if(n%5===0&&n<50&&cards.length<3){const c=sh(Object.keys(CARDS))[0];cards.push(c);got=`<br>🃏 Kartu baru: ${CARDS[c][0]} ${CARDS[c][1]}`}
 $('#fb').innerHTML=`<div class="fb"><b>${msg}</b>${got}<br><span class="hz">${q.x.h}</span> · ${q.x.p} · ${q.x.m}</div><button class="go" onclick="next()">${n<50?'Lanjut ➜':'Lihat Hasil 🏆'}</button>`;drawCards()}
function next(){i++;i<50?show():fin()}
function fin(){const t=score>6500?'状元 Juara Sejati':score>4500?'举人 Cendekiawan':score>2500?'秀才 Pelajar Hebat':'学生 Terus Berlatih';
 app.innerHTML=`<div class="card"><h1>🏆 Hasil</h1><div class="lab">Gelar kamu</div><div class="big">${t}</div><div class="stat">${score}</div><div class="lab" style="text-align:center">poin</div><p style="text-align:center">Benar penuh: <b>${ok}/50</b> · Streak terbaik: <b>🔥 ${best}</b></p>
<div class="sec"><button class="go" onclick="start()">Main lagi 🔀</button><button class="go alt" onclick="share()">Bagikan 🔗</button></div><div id="sm" class="lab" style="text-align:center;margin-top:8px"></div></div>`}
async function share(){const txt=`Aku dapat ${score} poin di Mandarin Lantern Quiz! Coba kalahkan: ${location.href}`;
 try{if(navigator.share){await navigator.share({text:txt});return}await navigator.clipboard.writeText(txt);$('#sm').textContent='Teks & link disalin!'}catch(e){$('#sm').textContent='Salin
 link dari address bar ya.'}}
try{speechSynthesis.getVoices()}catch(e){}
home();
</script></body></html>
